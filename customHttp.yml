customHeaders:
  - pattern: '**'
    headers:
      - key: 'Content-Security-Policy'
        value: "base-uri 'self'; connect-src 'self' https://1la3mp57zg.execute-api.eu-west-2.amazonaws.com; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; style-src 'self' 'unsafe-inline'; worker-src 'self'; upgrade-insecure-requests"
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'Referrer-Policy'
        value: 'no-referrer'
      - key: 'Permissions-Policy'
        value: 'accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=()'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Permitted-Cross-Domain-Policies'
        value: 'none'
      - key: 'X-XSS-Protection'
        value: '0'
  - pattern: '/config/app-config.json'
    headers:
      - key: 'Cache-Control'
        value: 'no-store, max-age=0'
