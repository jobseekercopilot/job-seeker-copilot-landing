version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm run config:generate
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/job-seeker-copilot-landing/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
